<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Playing, phone</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Pixelify+Sans:wght@400;600&display=swap">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: #0e0b1c; color: #d4caff; font-family: 'Pixelify Sans', ui-monospace, monospace">

<div style="height: 372px; flex: none; display: flex; align-items: flex-end; justify-content: center; background: #000000">
<div style="width: 390px; height: 260px; display: flex; align-items: center; justify-content: center; background: #0a0814; color: #5a5673; font-family: ui-monospace, monospace; font-size: 12px">game screen, 240 × 160 at 1.625×</div>
</div>

<div style="flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 20px 24px 28px; border-top: 1px solid #2a2640">

<div style="display: flex; justify-content: space-between">
<button aria-label="L" style="width: 84px; height: 44px; border: 1px solid #3a3652; border-radius: 12px; background: #1f1c33; color: #d4caff; font: inherit; font-size: 16px">L</button>
<button aria-label="R" style="width: 84px; height: 44px; border: 1px solid #3a3652; border-radius: 12px; background: #1f1c33; color: #d4caff; font: inherit; font-size: 16px">R</button>
</div>

<div style="display: flex; align-items: center; justify-content: space-between">
<div aria-label="D-pad" style="position: relative; width: 144px; height: 144px; color: #d4caff">
<div style="position: absolute; left: 48px; top: 0; width: 48px; height: 144px; border-radius: 10px; background: #26223f"></div>
<div style="position: absolute; left: 0; top: 48px; width: 144px; height: 48px; border-radius: 10px; background: #26223f"></div>
<svg width="144" height="144" viewBox="0 0 144 144" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; inset: 0"><path d="M65 28l7-7 7 7"></path><path d="M65 116l7 7 7-7"></path><path d="M28 65l-7 7 7 7"></path><path d="M116 65l7 7-7 7"></path></svg>
</div>
<div style="position: relative; width: 144px; height: 144px">
<button aria-label="B" style="position: absolute; left: 0; bottom: 8px; width: 68px; height: 68px; border: 1px solid #5b45c4; border-radius: 999px; background: #2a2152; color: #ffffff; font: inherit; font-size: 22px">B</button>
<button aria-label="A" style="position: absolute; right: 0; top: 8px; width: 68px; height: 68px; border: 1px solid #5b45c4; border-radius: 999px; background: #2a2152; color: #ffffff; font: inherit; font-size: 22px">A</button>
</div>
</div>

<div style="display: flex; justify-content: space-between">
<div style="display: flex; gap: 8px">
<button aria-label="Pause menu" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid #3a3652; border-radius: 999px; background: #1f1c33; color: #d4caff"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h16"></path></svg></button>
<button style="width: 76px; height: 44px; border: 1px solid #3a3652; border-radius: 999px; background: #1f1c33; color: #d4caff; font: inherit; font-size: 13px; letter-spacing: 0.04em">Select</button>
</div>
<div style="display: flex; gap: 8px">
<button style="width: 76px; height: 44px; border: 1px solid #3a3652; border-radius: 999px; background: #1f1c33; color: #d4caff; font: inherit; font-size: 13px; letter-spacing: 0.04em">Start</button>
<button aria-label="Hold" aria-pressed="false" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid #3a3652; border-radius: 999px; background: #1f1c33; color: #d4caff"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></button>
<button aria-label="Fast-forward" aria-pressed="true" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid #6d4aff; border-radius: 999px; background: #6d4aff; color: #ffffff"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 5.5v13l9-6.5z"></path><path d="M12 5.5v13l9-6.5z"></path></svg></button>
</div>
</div>

</div>
</div>
</body>
</html>
