<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App icon options</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Pixelify+Sans:wght@400;600&display=swap">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="width: 1230px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; gap: 40px; padding: 48px; background: #0e0b1c; color: #c4c2d6; font-family: 'Geist', system-ui, sans-serif; font-size: 14px; line-height: 1.4">

<svg width="0" height="0" aria-hidden="true" style="position: absolute">
<defs>
<linearGradient id="ic-glass-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34277a"></stop><stop offset="1" stop-color="#120d2b"></stop></linearGradient>
<linearGradient id="ic-glass-pad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9a6ff" stop-opacity="0.75"></stop><stop offset="1" stop-color="#7c5cff" stop-opacity="0.45"></stop></linearGradient>
</defs>
</svg>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px">

<div style="display: flex; flex-direction: column; gap: 24px; padding: 28px; border: 1px solid #7c5cff; border-radius: 16px; background: #19162a">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<div style="font-family: 'Pixelify Sans', ui-monospace, monospace; font-size: 20px; color: #ffffff">A · Pad</div>
<div style="font-size: 13px; color: #d4caff">Chosen</div>
</div>
<div style="display: flex; justify-content: center"><svg width="200" height="200" viewBox="0 0 100 100" role="img" aria-label="Pad icon"><rect width="100" height="100" rx="23" fill="#6d4aff"></rect><rect x="29" y="31" width="13" height="38" rx="3" fill="#ffffff"></rect><rect x="16.5" y="43.5" width="38" height="13" rx="3" fill="#ffffff"></rect><circle cx="68" cy="59" r="7.5" fill="#ffffff"></circle><circle cx="81" cy="42" r="7.5" fill="#ffffff"></circle></svg></div>
<div style="display: flex; align-items: flex-end; justify-content: center; gap: 24px">
<svg width="64" height="64" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="23" fill="#6d4aff"></rect><rect x="29" y="31" width="13" height="38" rx="3" fill="#ffffff"></rect><rect x="16.5" y="43.5" width="38" height="13" rx="3" fill="#ffffff"></rect><circle cx="68" cy="59" r="7.5" fill="#ffffff"></circle><circle cx="81" cy="42" r="7.5" fill="#ffffff"></circle></svg>
<svg width="32" height="32" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="23" fill="#6d4aff"></rect><rect x="29" y="31" width="13" height="38" rx="3" fill="#ffffff"></rect><rect x="16.5" y="43.5" width="38" height="13" rx="3" fill="#ffffff"></rect><circle cx="68" cy="59" r="7.5" fill="#ffffff"></circle><circle cx="81" cy="42" r="7.5" fill="#ffffff"></circle></svg>
<svg width="16" height="16" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="23" fill="#6d4aff"></rect><rect x="29" y="31" width="13" height="38" rx="3" fill="#ffffff"></rect><rect x="16.5" y="43.5" width="38" height="13" rx="3" fill="#ffffff"></rect><circle cx="68" cy="59" r="7.5" fill="#ffffff"></circle><circle cx="81" cy="42" r="7.5" fill="#ffffff"></circle></svg>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 24px; padding: 28px; border: 1px solid #3a3652; border-radius: 16px; background: #19162a">
<div style="font-family: 'Pixelify Sans', ui-monospace, monospace; font-size: 20px; color: #ffffff">B · Stick</div>
<div style="display: flex; justify-content: center"><svg width="200" height="200" viewBox="0 0 100 100" role="img" aria-label="Stick icon" style="border-radius: 46px; box-shadow: 0 0 0 1px #3a3652"><rect width="100" height="100" rx="23" fill="#19162a"></rect><rect x="20" y="60" width="60" height="20" rx="6" fill="none" stroke="#d4caff" stroke-width="5"></rect><path d="M50 60V38" stroke="#d4caff" stroke-width="5" stroke-linecap="round"></path><circle cx="50" cy="29" r="10" fill="#7c5cff"></circle><circle cx="33" cy="70" r="3.5" fill="#7c5cff"></circle></svg></div>
<div style="display: flex; align-items: flex-end; justify-content: center; gap: 24px">
<svg width="64" height="64" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="23" fill="#19162a"></rect><rect x="20" y="60" width="60" height="20" rx="6" fill="none" stroke="#d4caff" stroke-width="5"></rect><path d="M50 60V38" stroke="#d4caff" stroke-width="5" stroke-linecap="round"></path><circle cx="50" cy="29" r="10" fill="#7c5cff"></circle><circle cx="33" cy="70" r="3.5" fill="#7c5cff"></circle></svg>
<svg width="32" height="32" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="23" fill="#19162a"></rect><rect x="20" y="60" width="60" height="20" rx="6" fill="none" stroke="#d4caff" stroke-width="5"></rect><path d="M50 60V38" stroke="#d4caff" stroke-width="5" stroke-linecap="round"></path><circle cx="50" cy="29" r="10" fill="#7c5cff"></circle><circle cx="33" cy="70" r="3.5" fill="#7c5cff"></circle></svg>
<svg width="16" height="16" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="23" fill="#19162a"></rect><rect x="20" y="60" width="60" height="20" rx="6" fill="none" stroke="#d4caff" stroke-width="5"></rect><path d="M50 60V38" stroke="#d4caff" stroke-width="5" stroke-linecap="round"></path><circle cx="50" cy="29" r="10" fill="#7c5cff"></circle><circle cx="33" cy="70" r="3.5" fill="#7c5cff"></circle></svg>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 24px; padding: 28px; border: 1px solid #3a3652; border-radius: 16px; background: #19162a">
<div style="font-family: 'Pixelify Sans', ui-monospace, monospace; font-size: 20px; color: #ffffff">C · Glass</div>
<div style="display: flex; justify-content: center"><svg width="200" height="200" viewBox="0 0 100 100" role="img" aria-label="Glass icon"><rect width="100" height="100" rx="23" fill="url(#ic-glass-bg)"></rect><rect x="11" y="30" width="78" height="40" rx="20" fill="url(#ic-glass-pad)" stroke="#ecebf5" stroke-opacity="0.55" stroke-width="1.5"></rect><path d="M24 39c6-5 20-6 34-6" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"></path><rect x="28.5" y="40" width="7" height="20" rx="2" fill="#ffffff"></rect><rect x="22" y="46.5" width="20" height="7" rx="2" fill="#ffffff"></rect><circle cx="62" cy="55" r="4.5" fill="#ffffff"></circle><circle cx="73" cy="45" r="4.5" fill="#ffffff"></circle></svg></div>
<div style="display: flex; align-items: flex-end; justify-content: center; gap: 24px">
<svg width="64" height="64" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="23" fill="url(#ic-glass-bg)"></rect><rect x="11" y="30" width="78" height="40" rx="20" fill="url(#ic-glass-pad)" stroke="#ecebf5" stroke-opacity="0.55" stroke-width="1.5"></rect><path d="M24 39c6-5 20-6 34-6" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"></path><rect x="28.5" y="40" width="7" height="20" rx="2" fill="#ffffff"></rect><rect x="22" y="46.5" width="20" height="7" rx="2" fill="#ffffff"></rect><circle cx="62" cy="55" r="4.5" fill="#ffffff"></circle><circle cx="73" cy="45" r="4.5" fill="#ffffff"></circle></svg>
<svg width="32" height="32" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="23" fill="url(#ic-glass-bg)"></rect><rect x="11" y="30" width="78" height="40" rx="20" fill="url(#ic-glass-pad)" stroke="#ecebf5" stroke-opacity="0.55" stroke-width="1.5"></rect><path d="M24 39c6-5 20-6 34-6" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"></path><rect x="28.5" y="40" width="7" height="20" rx="2" fill="#ffffff"></rect><rect x="22" y="46.5" width="20" height="7" rx="2" fill="#ffffff"></rect><circle cx="62" cy="55" r="4.5" fill="#ffffff"></circle><circle cx="73" cy="45" r="4.5" fill="#ffffff"></circle></svg>
<svg width="16" height="16" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="23" fill="url(#ic-glass-bg)"></rect><rect x="11" y="30" width="78" height="40" rx="20" fill="url(#ic-glass-pad)" stroke="#ecebf5" stroke-opacity="0.55" stroke-width="1.5"></rect><path d="M24 39c6-5 20-6 34-6" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"></path><rect x="28.5" y="40" width="7" height="20" rx="2" fill="#ffffff"></rect><rect x="22" y="46.5" width="20" height="7" rx="2" fill="#ffffff"></rect><circle cx="62" cy="55" r="4.5" fill="#ffffff"></circle><circle cx="73" cy="45" r="4.5" fill="#ffffff"></circle></svg>
</div>
</div>

</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; flex: 1">

<div style="display: flex; flex-direction: column; justify-content: space-between; gap: 16px; padding: 28px; border: 1px solid #3a3652; border-radius: 16px; background: #0e0b1c">
<div style="font-size: 13px; color: #8e8aa8">Wordmark, dark</div>
<div style="display: flex; align-items: center; gap: 14px">
<svg width="48" height="48" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="23" fill="#6d4aff"></rect><rect x="29" y="31" width="13" height="38" rx="3" fill="#ffffff"></rect><rect x="16.5" y="43.5" width="38" height="13" rx="3" fill="#ffffff"></rect><circle cx="68" cy="59" r="7.5" fill="#ffffff"></circle><circle cx="81" cy="42" r="7.5" fill="#ffffff"></circle></svg>
<div style="font-family: 'Pixelify Sans', ui-monospace, monospace; font-size: 36px; font-weight: 600; letter-spacing: 0.02em; color: #ffffff">pkhemu</div>
</div>
<div style="font-size: 13px; color: #8e8aa8">Header, splash, about screen</div>
</div>

<div style="display: flex; flex-direction: column; justify-content: space-between; gap: 16px; padding: 28px; border-radius: 16px; background: #f6f5fb">
<div style="font-size: 13px; color: #5a5673">Wordmark, light</div>
<div style="display: flex; align-items: center; gap: 14px">
<svg width="48" height="48" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="23" fill="#6d4aff"></rect><rect x="29" y="31" width="13" height="38" rx="3" fill="#ffffff"></rect><rect x="16.5" y="43.5" width="38" height="13" rx="3" fill="#ffffff"></rect><circle cx="68" cy="59" r="7.5" fill="#ffffff"></circle><circle cx="81" cy="42" r="7.5" fill="#ffffff"></circle></svg>
<div style="font-family: 'Pixelify Sans', ui-monospace, monospace; font-size: 36px; font-weight: 600; letter-spacing: 0.02em; color: #0e0b1c">pkhemu</div>
</div>
<div style="font-size: 13px; color: #5a5673">Same mark, no second version needed</div>
</div>

<div style="display: flex; flex-direction: column; justify-content: space-between; gap: 16px; padding: 28px; border: 1px solid #3a3652; border-radius: 16px; background: #0e0b1c">
<div style="font-size: 13px; color: #8e8aa8">Android adaptive and monochrome</div>
<div style="display: flex; align-items: center; gap: 20px">
<svg width="72" height="72" viewBox="0 0 100 100" role="img" aria-label="Round mask"><circle cx="50" cy="50" r="50" fill="#6d4aff"></circle><rect x="33" y="35" width="10" height="30" rx="2.5" fill="#ffffff"></rect><rect x="23" y="45" width="30" height="10" rx="2.5" fill="#ffffff"></rect><circle cx="64" cy="57" r="6" fill="#ffffff"></circle><circle cx="74.5" cy="43.5" r="6" fill="#ffffff"></circle></svg>
<svg width="72" height="72" viewBox="0 0 100 100" role="img" aria-label="Monochrome"><circle cx="50" cy="50" r="50" fill="#1f1c33"></circle><rect x="33" y="35" width="10" height="30" rx="2.5" fill="#d4caff"></rect><rect x="23" y="45" width="30" height="10" rx="2.5" fill="#d4caff"></rect><circle cx="64" cy="57" r="6" fill="#d4caff"></circle><circle cx="74.5" cy="43.5" r="6" fill="#d4caff"></circle></svg>
</div>
<div style="font-size: 13px; color: #8e8aa8">Glyph stays inside the 66% safe zone</div>
</div>

</div>
</div>
</body>
</html>
