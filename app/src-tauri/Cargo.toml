[package]
name = "pkh-emu"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "pkh_emu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cmake = "0.1.58"
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = [] }
serde = { version = "1", features = ["derive"] }
tauri-plugin-dialog = "2.8.2"
tauri-plugin-fs = "2.7.0"
tauri-plugin-opener = "2.7.1"
tauri-plugin-persisted-scope = "2.4.1"
tauri-plugin-store = "2.5.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
sevenz-rust2 = { version = "0.23.0", default-features = false, features = ["bzip2", "ppmd"] }
tokio = { version = "1.53.2", features = ["sync", "time", "net", "io-util"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cpal = "0.18.2"
ringbuf = "0.5.2"
tauri-plugin-os = "2.4.0"
png = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
serde_json = "1.0.151"
sha2 = "0.10"
percent-encoding = "2"
rusqlite = "0.40.2"
libloading = "0.9.0"
tauri-plugin-clipboard-manager = "2.4.2"
rom-art = { path = "../../crates/rom-art" }
sha1 = "0.10"
libc = "0.2"
tempfile = "3"
oxidelta = { version = "0.1.4", default-features = false, features = ["adler32", "lzma-secondary"] }
crc32fast = "1.5.2"
lzma-rs = "0.3"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "form", "query"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
base64 = "0.22"
getrandom = "0.3"
url = "2"
bytes = "1"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-android-fs = "29"

# Bundled SQLite calls fstatfs on every Apple target, which App Store review counts as reading disk space.
# iOS links the system SQLite instead.
[target.'cfg(not(target_os = "ios"))'.dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }

[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-pkhemu-ios = { path = "../../crates/tauri-plugin-pkhemu-ios" }
tauri-plugin-haptics = "2.4.2"
objc2-ui-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "UIApplication", "UIGeometry", "UIResponder", "UIScene", "UIScrollView", "UIView", "UIViewController", "UIWindow", "UIWindowScene"] }
dispatch2 = "0.3.1"
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CAFrameRateRange"] }

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
objc2 = "0.6"

[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "3.6", features = ["apple-native", "windows-native", "linux-native"] }

[dev-dependencies]
sevenz-rust2 = { version = "0.23.0", default-features = false, features = ["compress"] }
